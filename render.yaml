services:
  - type: web
    name: aurafit-ai-ultra-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: ALLOWED_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: TRUST_PROXY
        value: "1"
