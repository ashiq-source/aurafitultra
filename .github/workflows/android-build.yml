name: AuraFit Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Test and build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Capacitor web assets
        shell: bash
        run: |
          mkdir -p public/icons
          cp aurafit-ultra.html public/index.html
          cp aurafit-ultra.html public/aurafit-ultra.html
          cp aurafit-ultra.css aurafit-android.css aurafit-ultra-app.js aurafit-ultra-data-layer.js public/
          cp aurafit-phase5.js aurafit-phase6.js aurafit-phase7.js aurafit-phase8.js public/
          cp aurafit-config.js aurafit-cloud.js aurafit-android.js public/
          cp manifest.webmanifest service-worker.js migration-console.html public/
          cp icons/icon.svg public/icons/icon.svg

      - name: Bundle browser JavaScript for Android WebView
        run: npm run build:android:web

      - name: Run syntax checks
        run: npm run check

      - name: Run project tests
        run: npm test

      - name: Generate Android platform when not committed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure OAuth deep link for Android
        run: node scripts/patch-android-manifest.mjs

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set Android version code and name
        run: node scripts/set-android-version.mjs

      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload Android build files
        uses: actions/upload-artifact@v6
        with:
          name: AuraFit-AI-Ultra-Android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
